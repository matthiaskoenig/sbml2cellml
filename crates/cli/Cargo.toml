[package]
name = "sbml2cellml-cli"
description = "Command line of the rust CellML reader and converter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "cellml-info"
path = "src/main.rs"

[[bin]]
name = "cellml-convert"
path = "src/convert.rs"

[[bin]]
name = "cellml-write"
path = "src/write.rs"

[[bin]]
name = "sbml-convert"
path = "src/tocellml.rs"

[dependencies]
cellml = { package = "sbml2cellml-cellml", path = "../cellml" }
convert = { package = "sbml2cellml-convert", path = "../convert" }
tocellml = { package = "sbml2cellml-tocellml", path = "../tocellml" }
sbml = { package = "sbmlsim-sbml", git = "https://github.com/matthiaskoenig/sbmlsim-core", rev = "f8609ef" }

[lints]
workspace = true
