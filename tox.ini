[tox]
envlist = ty, py3.13, py3.14

[testenv]
# tox-uv creates the environment from uv.lock with `uv sync`, which honours the
# libopencor index of [tool.uv] in pyproject.toml; the dev extra therefore
# contains libopencor and the simulation tests run instead of being skipped
runner = uv-venv-lock-runner
extras =
    dev
passenv =
    SBML2CELLML_TESTSUITE
    SBML2CELLML_CACHE
commands =
    pytest {posargs}

[testenv:ty]
runner = uv-venv-lock-runner
extras =
    dev
passenv =
    TY_OUTPUT_FORMAT
commands =
    ty check

[testenv:testsuite]
runner = uv-venv-lock-runner
extras =
    dev
setenv =
    SBML2CELLML_TESTSUITE = 1
passenv =
    SBML2CELLML_CACHE
commands =
    pytest -n 0 -m testsuite tests/test_testsuite_full.py
