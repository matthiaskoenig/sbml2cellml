[tox]
envlist = ty, py3.13, py3.14

[testenv]
# tox-uv creates the environment from uv.lock with `uv sync`, which honours the
# libopencor index of [tool.uv] in pyproject.toml; the dev extra therefore
# contains libopencor and the simulation tests run instead of being skipped
runner = uv-venv-lock-runner
extras =
    dev
passenv =
    SBML2CELLML_TESTSUITE
    SBML2CELLML_CACHE
commands =
    pytest {posargs}

[testenv:ty]
runner = uv-venv-lock-runner
extras =
    dev
passenv =
    TY_OUTPUT_FORMAT
commands =
    ty check

[testenv:testsuite]
# the pipelines of the SBML test suite and of BioModels run with python 3.14
# only, the unit tests with every supported python
base_python = python3.14
runner = uv-venv-lock-runner
extras =
    dev
setenv =
    SBML2CELLML_TESTSUITE = 1
passenv =
    SBML2CELLML_CACHE
commands =
    pytest -n 0 -m testsuite tests/test_testsuite_full.py

[testenv:biomodels]
# local only, never in CI: downloads and simulates the curated models of
# BioModels and writes the committed results, see biomodels/README.md
base_python = python3.14
runner = uv-venv-lock-runner
extras =
    dev
passenv =
    SBML2CELLML_CACHE
commands =
    sbml2cellml-biomodels run {posargs}
