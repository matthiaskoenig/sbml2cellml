name: documentation

on:
  push:
    # feature branches are built through their pull request
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one; a cancelled deployment leaves the
  # published site as it was, the newer run deploys
  cancel-in-progress: true

jobs:
  docs:
    # the name the branch protection requires, see .github/rulesets/
    name: docs
    # ubuntu 24.04 instead of ubuntu-latest, see the `test` job of ci-cd.yml
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # the standalone interpreter uv manages, see the `test` job of ci-cd.yml
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-python: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Cache the registry and the build of the converter
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: wasm-${{ runner.os }}-
      - name: Build the module of the online converter
        # the toolchain and its wasm target come from rust-toolchain.toml,
        # which rustup reads on the first cargo call
        run: uv run python scripts/build_wasm.py
      - name: Build the assets of the interactive simulation
        # the compiled repressilator and the runtime of sbmlsim-core, which
        # the roundtrip page simulates in the browser
        run: uv run python scripts/build_simulation.py
      - name: Build the documentation
        # the API reference is rendered from the docstrings by mkdocstrings,
        # so the package has to be importable
        run: uv run zensical build --clean --strict
      - name: Generate the agent facing files
        # llms.txt, llms-full.txt and the markdown of every page
        run: uv run python scripts/llms_txt.py
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: docs
    # only the default branch publishes to https://matthiaskoenig.github.io/sbml2cellml
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write     # deploy to GitHub Pages
      id-token: write  # verify the deployment originates from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
