name: CI-CD

on:
  push:
    # feature branches are tested through their pull request, tags release
    branches: [develop, main]
    tags: ['*']
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# least privilege by default, the release job raises what it needs
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one of the same branch or pull request;
  # a release is never superseded, every tag is a group of its own
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # the tests run with the standalone interpreter uv manages, whose libpython
      # is put on the library search path below
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        # no windows for now: the win_amd64 wheels of libcellml 0.7.1 contain
        # ARM64 binaries (https://github.com/cellml/libcellml/issues/1460)
        os: [ubuntu-latest, macos-latest]
        # continuous integration tests the newest python, 3.13 is tested
        # locally with `tox run-parallel`, see docs/development.md
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv and set the python version
      # astral-sh/setup-uv publishes no floating major tag beyond v7
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        # the interpreter is cached with the packages instead of downloaded by every run
        cache-python: true
    - name: Put libpython on the library search path (linux only)
      # the extension of libroadrunner links against libpython3.X.so.1.0. The
      # standalone interpreters of uv ship it in their `lib` directory but are
      # linked statically and never load it, so without this the import of
      # roadrunner fails. tox passes LD_LIBRARY_PATH on to the tests.
      if: runner.os == 'Linux'
      env:
        PYTHON_VERSION: ${{ matrix.python-version }}
      run: |
        uv python install "$PYTHON_VERSION"
        prefix="$("$(uv python find --no-project "$PYTHON_VERSION")" -c 'import sys; print(sys.base_prefix)')"
        echo "LD_LIBRARY_PATH=${prefix}/lib" >> "$GITHUB_ENV"
      shell: bash
    - name: Cache the SBML test suite
      # the complete SBML test suite runs on linux only
      if: runner.os == 'Linux'
      uses: actions/cache@v6
      with:
        path: ~/.cache/sbml2cellml
        key: sbml-test-suite-3.5.0
    - name: Test with tox
      env:
        # the complete SBML test suite runs on linux only
        SBML2CELLML_TESTSUITE: ${{ runner.os == 'Linux' && '1' || '' }}
      # the slowest tests are listed, so that a test which becomes slow is seen
      run:
        uvx --with tox-uv tox -e py${{ matrix.python-version }} -- --durations=15

  tests:
    # the one check the branch protection requires; the names of the matrix
    # jobs change with the matrix, this name does not, see .github/rulesets/
    name: tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check the result of the test matrix
      env:
        RESULT: ${{ needs.test.result }}
      run: |
        echo "test matrix: $RESULT"
        test "$RESULT" = "success"

  release:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/sbml2cellml
    permissions:
      id-token: write  # trusted publishing to PyPI
      contents: write  # create the GitHub release
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v10.2.0
      with:
        python-version: "3.14"
        enable-cache: true
    - name: Build package
      run: uvx hatch build
    - name: Check the package
      run: uvx twine check dist/*
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        body_path: "docs/release-notes/${{ github.ref_name }}.md"
        draft: false
        prerelease: false

  sync-main:
    # main tracks the latest published release, see docs/development.md
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
    - uses: actions/checkout@v7
      with:
        # a shallow clone cannot be pushed to another branch
        fetch-depth: 0
    - name: Fast-forward main to the release
      # no --force: the push fails loudly if it would not be a fast-forward
      run: git push origin HEAD:main
