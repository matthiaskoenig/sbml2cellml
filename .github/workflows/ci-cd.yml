name: CI-CD

on:
  push:
    # feature branches are tested through their pull request, tags release
    branches: [develop, main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# least privilege by default, the release job raises what it needs
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # a newer run supersedes the running one of the same branch or pull request;
  # a release is never superseded, every tag is a group of its own
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # the tests run with the standalone interpreter uv manages
      UV_PYTHON_PREFERENCE: only-managed
      # the git command line fetches a git dependency, which respects the
      # core.longpaths of windows
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    strategy:
      fail-fast: false
      matrix:
        # libcellml 0.7.2 publishes x64 windows wheels again
        # (https://github.com/cellml/libcellml/issues/1460)
        # ubuntu 24.04 instead of ubuntu-latest: the wheels of libcellml link
        # libxml2.so.2 and ubuntu 26.04 ships libxml2 2.15 as libxml2-16,
        # which provides libxml2.so.16 only
        os: [ubuntu-24.04, macos-latest, windows-latest]
        # python 3.14 is the only supported version, see docs/development.md
        python-version: ["3.14"]

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Let git use long paths on windows
      # cargo clones the submodules of a git dependency, and a path of the
      # sundials test data of sbmlsim-core is longer than the 260 characters
      # windows allows without the long path prefix, which git uses with
      # core.longpaths; cargo fetches with the git command line
      # (CARGO_NET_GIT_FETCH_WITH_CLI), so that the setting counts
      if: runner.os == 'Windows'
      run: git config --global core.longpaths true
    - name: Install uv and set the python version
      # astral-sh/setup-uv publishes no floating major tag beyond v7
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        # the interpreter is cached with the packages instead of downloaded by every run
        cache-python: true
    - name: Cache the rust registry and build
      # uv builds the package, and with it the rust module sbml2cellml._rust
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: rust-${{ runner.os }}-
    - name: Cache the SBML test suite
      # the complete SBML test suite runs on linux only
      if: runner.os == 'Linux'
      uses: actions/cache@v6
      with:
        path: ~/.cache/sbml2cellml
        # the key is the commit of the suite, see SUITE_COMMIT of
        # sbml2cellml.testsuite.cases
        key: sbml-test-suite-bbcbc80
    - name: Test with tox
      env:
        # the complete SBML test suite runs on linux only
        SBML2CELLML_TESTSUITE: ${{ runner.os == 'Linux' && '1' || '' }}
      # the slowest tests are listed, so that a test which becomes slow is seen
      run:
        uvx --with tox-uv tox -e py${{ matrix.python-version }} -- --durations=15

  tests:
    # the one check the branch protection requires; the names of the matrix
    # jobs change with the matrix, this name does not, see .github/rulesets/
    name: tests
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check the result of the test matrix
      env:
        RESULT: ${{ needs.test.result }}
      run: |
        echo "test matrix: $RESULT"
        test "$RESULT" = "success"

  wheels:
    # the package holds the rust module sbml2cellml._rust, so a wheel is
    # built per platform; the stable ABI of python 3.14 (abi3) makes one
    # wheel per platform enough
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-latest
            target: universal2-apple-darwin
          - os: windows-latest
            target: x64
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Build the wheel
      uses: PyO3/maturin-action@v1.51.0
      with:
        command: build
        args: --release --out dist
        target: ${{ matrix.target }}
        manylinux: auto
    - name: Upload the wheel
      uses: actions/upload-artifact@v7.0.2
      with:
        name: wheel-${{ matrix.os }}-${{ matrix.target }}
        path: dist/*.whl

  sdist:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Build the sdist
      uses: PyO3/maturin-action@v1.51.0
      with:
        command: sdist
        args: --out dist
    - name: Upload the sdist
      uses: actions/upload-artifact@v7.0.2
      with:
        name: sdist
        path: dist/*.tar.gz

  release:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/sbml2cellml
    permissions:
      id-token: write  # trusted publishing to PyPI
      contents: write  # create the GitHub release
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: "3.14"
        enable-cache: true
    - name: Download the wheels and the sdist
      uses: actions/download-artifact@v8.0.2
      with:
        path: dist
        merge-multiple: true
    - name: Check the package
      run: uvx twine check dist/*
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist
    - name: Create GitHub release
      uses: softprops/action-gh-release@v3
      with:
        body_path: "docs/release-notes/${{ github.ref_name }}.md"
        draft: false
        prerelease: false

  sync-main:
    # main tracks the latest published release, see docs/development.md
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # fast-forward main to the released commit
    steps:
    - uses: actions/checkout@v7
      with:
        # a shallow clone cannot be pushed to another branch
        fetch-depth: 0
    - name: Fast-forward main to the release
      # no --force: the push fails loudly if it would not be a fast-forward
      run: git push origin HEAD:main
