[workspace]
resolver = "3"
members = ["crates/cellml", "crates/cli"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
authors = ["Matthias König"]
repository = "https://github.com/matthiaskoenig/sbml2cellml"

[workspace.dependencies]
roxmltree = "0.20"
thiserror = "2"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
