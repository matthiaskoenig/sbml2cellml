[project]
site_name = "sbml2cellml"
site_url = "https://matthiaskoenig.github.io/sbml2cellml/"
site_description = "Conversion of SBML models to CellML"
site_author = "Matthias König"

copyright = 'Copyright &copy; 2025-2026 <a href="https://livermetabolism.com">Matthias König</a>'

repo_url = "https://github.com/matthiaskoenig/sbml2cellml"
repo_name = "matthiaskoenig/sbml2cellml"
edit_uri = "edit/develop/docs/"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "User guide" = [
    { "Installation" = "installation.md" },
    { "Conversion" = "conversion.md" },
    { "Simulation" = "simulation.md" },
    { "Roundtrip example" = "roundtrip.md" },
  ] },
  { "Status" = [
    { "Conversion issues" = "conversion-issues.md" },
    { "SBML test suite" = "testsuite.md" },
    { "BioModels" = "biomodels.md" },
  ] },
  { "API reference" = [
    { "Overview" = "api/index.md" },
    { "sbml2cellml" = "api/sbml2cellml.md" },
    { "cellml2sbml" = "api/cellml2sbml.md" },
    { "cellml" = "api/cellml.md" },
    { "sbml" = "api/sbml.md" },
    { "mathml" = "api/mathml.md" },
    { "astnodes" = "api/astnodes.md" },
    { "sbmlmath" = "api/sbmlmath.md" },
    { "units" = "api/units.md" },
    { "cellmlunits" = "api/cellmlunits.md" },
    { "variables" = "api/variables.md" },
    { "simulate" = "api/simulate.md" },
    { "cli" = "api/cli.md" },
    { "console" = "api/console.md" },
    { "log" = "api/log.md" },
    { "sbml2cellml.testsuite" = [
      { "cases" = "api/testsuite.cases.md" },
      { "compare" = "api/testsuite.compare.md" },
      { "simulators" = "api/testsuite.simulators.md" },
      { "worker" = "api/testsuite.worker.md" },
      { "runner" = "api/testsuite.runner.md" },
      { "results" = "api/testsuite.results.md" },
      { "report" = "api/testsuite.report.md" },
      { "figure" = "api/testsuite.figure.md" },
      { "cli" = "api/testsuite.cli.md" },
    ] },
    { "sbml2cellml.biomodels" = [
      { "models" = "api/biomodels.models.md" },
      { "cases" = "api/biomodels.cases.md" },
      { "runner" = "api/biomodels.runner.md" },
      { "cli" = "api/biomodels.cli.md" },
    ] },
  ] },
  { "Release notes" = [
    { "Overview" = "release-notes/index.md" },
    { "0.4.0" = "release-notes/0.4.0.md" },
    { "0.3.5" = "release-notes/0.3.5.md" },
    { "0.3.4" = "release-notes/0.3.4.md" },
    { "0.3.3" = "release-notes/0.3.3.md" },
    { "0.3.2" = "release-notes/0.3.2.md" },
    { "0.3.1" = "release-notes/0.3.1.md" },
    { "0.3.0" = "release-notes/0.3.0.md" },
    { "0.2.0" = "release-notes/0.2.0.md" },
    { "0.1.0" = "release-notes/0.1.0.md" },
  ] },
  { "Development" = [
    { "Contributing" = "development.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/matthiaskoenig/sbml2cellml"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/sbml2cellml/"

# API reference is rendered from the docstrings, see the `docs/api` pages
[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
show_source = false
# the page provides the heading, see the `docs/api` pages
show_root_heading = false
show_root_toc_entry = false
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
members_order = "source"
separate_signature = true
signature_crossrefs = true
merge_init_into_class = true
filters = ["!^_"]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
