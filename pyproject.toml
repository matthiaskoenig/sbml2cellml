[build-system]
# maturin builds the python module of the rust converter
# (`sbml2cellml._rust`, crates/python) into the wheel next to the package
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "sbml2cellml"
version = "0.5.0"
description = "sbml2cellml converts between SBML and CellML."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
	{name="Matthias König", email="konigmatt@googlemail.com"},
]
maintainers = [
	{name="Matthias König", email="konigmatt@googlemail.com"},
]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Science/Research",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: Scientific/Engineering",
	"Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
	"modeling",
	"standardization",
	"COMBINE",
	"SBML",
	"CellML",
	"converter",
]
dependencies = [
	# SBML reading and formula parsing
	"python-libsbml>=5.21.2",
	# CellML model building, printing and validation
	"libcellml>=0.7.2",
	# console output of scripts and the CLI
	"rich>=15.0.0",
]

[project.optional-dependencies]
# timecourse simulation of CellML models with libopencor
# (`sbml2cellml.simulate`) and of SBML models with sbmlsim-core
# (`sbml2cellml.sbmlsim`), results and plots
simulate = [
	"libopencor>=1.20261113.0",
	"sbmlsim-core>=0.19.0",
	"pandas>=3.0.5",
	"matplotlib>=3.11.1",
]
# the SBML test suite harness: requests for the download of the models of
# BioModels, the cases of the suite are fetched with git
testsuite = [
	"sbml2cellml[simulate]",
	"requests>=2.32",
]
dev = [
	"sbml2cellml[testsuite]",
	"bump-my-version>=1.5.1",
	"ruff>=0.16.6",
	"pre-commit>=4.6.2",
	"ty>=0.0.79",
	"tox>=4.61.2",
	"tox-uv>=1.20",
	"pytest>=9.1.1",
	"pytest-xdist>=3.8",
	"zensical>=0.0.60",
	"mkdocstrings-python>=2.0.8",
]

[project.scripts]
sbml2cellml = "sbml2cellml.cli:main"
cellml2sbml = "sbml2cellml.cli:main_cellml2sbml"
sbml2cellml-testsuite = "sbml2cellml.testsuite.cli:main"
sbml2cellml-biomodels = "sbml2cellml.biomodels.cli:main"
sbml2cellml-physiome = "sbml2cellml.physiome.cli:main"
sbml2cellml-overview = "sbml2cellml.overview.cli:main"

[project.urls]
Homepage = "https://matthiaskoenig.github.io/sbml2cellml"
Documentation = "https://matthiaskoenig.github.io/sbml2cellml"
Repository = "https://github.com/matthiaskoenig/sbml2cellml"
Issues = "https://github.com/matthiaskoenig/sbml2cellml/issues"
Changelog = "https://matthiaskoenig.github.io/sbml2cellml/release-notes/"
Download = "https://pypi.org/project/sbml2cellml"

[tool.maturin]
# the python package is the src layout, the rust module is built from
# crates/python and lands in it as `sbml2cellml._rust`
python-source = "src"
module-name = "sbml2cellml._rust"
manifest-path = "crates/python/Cargo.toml"

[tool.uv]
# rebuild the editable install when the version or the rust sources change,
# so its metadata follows a version bump and the module follows the crates
cache-keys = [
	{ file = "pyproject.toml" },
	{ file = "src/sbml2cellml/__init__.py" },
	{ file = "crates/**/*.rs" },
	{ file = "crates/**/Cargo.toml" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the tests run in parallel (pytest-xdist), `pytest -n 0` runs them in one process
addopts = "-n auto"
markers = [
	"testsuite: runs the complete SBML test suite, enabled with SBML2CELLML_TESTSUITE=1",
]

[tool.ty.environment]
# the package lives in the src layout, the examples and scripts are modules at
# the root of the repository; the checked python version is inferred from
# `project.requires-python`
root = ["./src", "."]

[tool.ty.src]
include = ["src", "tests", "examples", "scripts"]

[tool.ty.terminal]
# warnings are failures: keep the codebase free of any diagnostic
error-on-warning = true
